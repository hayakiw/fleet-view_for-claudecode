<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FleetView — Claude Code Monitor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="conn-dot"></span>
    <span class="brand-name">FleetView</span>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="agents">プロセス</button>
    <button class="tab-btn" data-tab="org">組織図</button>
    <button class="tab-btn" data-tab="reports">レポート</button>
  </nav>
  <div class="actions">
    <button id="gen-report-btn">今すぐレポート生成</button>
  </div>
</header>

<main>
  <section id="tab-agents" class="tab-panel active">
    <div id="empty-state" class="empty-state" hidden>
      <p>まだ接続されたセッションがありません。</p>
      <p class="hint">hooks/settings-snippet.json の内容を Claude Code の設定に追加すると、
      セッション開始時からここに表示されます。</p>
    </div>
    <div id="agent-grid"></div>
  </section>

  <section id="tab-org" class="tab-panel">
    <div class="org-instruct-panel collapsed" id="org-instruct-panel">
      <button type="button" id="org-instruct-toggle" class="org-instruct-toggle" aria-expanded="false" aria-controls="org-instruct-body">
        <span class="org-instruct-toggle-label">📝 指示を出す</span>
        <span class="org-instruct-toggle-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="org-instruct-body" id="org-instruct-body">
        <div class="org-mode-toggle" id="org-mode-toggle" role="tablist">
          <button type="button" class="org-mode-btn active" data-mode="instruct" role="tab" aria-selected="true">📝 指示</button>
          <button type="button" class="org-mode-btn" data-mode="goal" role="tab" aria-selected="false">🎯 目標</button>
        </div>
        <p class="hint org-hint" id="org-mode-hint">何をしてほしいか書くだけで、内容に応じた役割に自動で振り分けて起動します。</p>
        <div class="org-project-bar">
          <label for="org-project-select">対象プロジェクト</label>
          <select id="org-project-select">
            <option value="">選択してください…</option>
          </select>
          <button type="button" id="org-project-add-btn" title="フォルダを選んで対象プロジェクトとして保存">＋ 追加</button>
          <button type="button" id="org-project-remove-btn" title="選択中の対象プロジェクトを削除">🗑</button>
        </div>
        <form id="org-dispatch-form" class="org-dispatch-form">
          <div class="org-composer">
            <textarea id="org-instruction-input" placeholder="例: ログイン画面のバリデーションを直して／レビューして／設計して" rows="1"></textarea>
            <button type="submit" id="org-dispatch-btn" aria-label="起動する（自動振り分け）" title="起動する（自動振り分け）">➤</button>
          </div>
          <p id="org-dispatch-status" class="org-dispatch-status"></p>
        </form>
      </div>
    </div>
    <div id="org-grid" class="org-grid"></div>
  </section>

  <section id="tab-reports" class="tab-panel">
    <div class="reports-layout">
      <aside class="reports-list" id="reports-list"></aside>
      <div class="report-view" id="report-view">
        <p class="hint">左のリストからレポートを選択してください。</p>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
