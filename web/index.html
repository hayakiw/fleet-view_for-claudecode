<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FleetView — Claude Code Monitor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot" id="conn-dot"></span>
    <span class="brand-name">FleetView</span>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="agents">プロセス</button>
    <button class="tab-btn" data-tab="org">組織図</button>
    <button class="tab-btn" data-tab="reports">レポート</button>
  </nav>
  <div class="actions">
    <button id="gen-report-btn">今すぐレポート生成</button>
  </div>
</header>

<main>
  <section id="tab-agents" class="tab-panel active">
    <div id="empty-state" class="empty-state" hidden>
      <p>まだ接続されたセッションがありません。</p>
      <p class="hint">hooks/settings-snippet.json の内容を Claude Code の設定に追加すると、
      セッション開始時からここに表示されます。</p>
    </div>
    <div id="agent-grid"></div>
  </section>

  <section id="tab-org" class="tab-panel">
    <p class="hint org-hint">何をしてほしいか書くだけで、内容に応じて適切な役割（アーキテクト/エンジニア/レビュアー）に自動で振り分けて起動します。</p>
    <div class="org-project-bar">
      <label for="org-project-input">対象プロジェクト</label>
      <input id="org-project-input" type="text" list="org-project-list" placeholder="例: C:\Users\hayak\work\myapp" autocomplete="off" />
      <datalist id="org-project-list"></datalist>
      <button type="button" id="org-browse-btn">📁 参照…</button>
    </div>
    <form id="org-dispatch-form" class="org-dispatch-form">
      <textarea id="org-instruction-input" placeholder="例: ログイン画面のバリデーションを直して／このコードをレビューして／通知機能の設計を考えて" rows="3"></textarea>
      <button type="submit" id="org-dispatch-btn">▶ 起動する（自動振り分け）</button>
    </form>
    <div id="org-grid" class="org-grid"></div>
  </section>

  <section id="tab-reports" class="tab-panel">
    <div class="reports-layout">
      <aside class="reports-list" id="reports-list"></aside>
      <div class="report-view" id="report-view">
        <p class="hint">左のリストからレポートを選択してください。</p>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
